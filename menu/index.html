<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Myntra Cafe</title><meta name="description" content="Visit the Myntra Cafe website to browse the menu and place a guest order."><style>html,body{margin:0;height:100%;background:#151510;color:#f5f0e5;font:16px system-ui}#cafe{border:0;width:100%;height:100dvh;display:block}#bar{position:fixed;left:12px;bottom:12px;display:flex;gap:8px;align-items:center;background:rgba(21,21,16,.88);border:1px solid #3a382e;border-radius:999px;padding:6px 6px 6px 12px;font-size:13px}#bar a{color:#f5f0e5;text-decoration:none;background:#6b5a2e;border-radius:999px;padding:6px 12px}#loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}</style></head><body><div id="loader" role="status">Opening Myntra Cafe…</div><iframe src="https://myntra-cafe.myntracafe.workers.dev/menu" id="cafe" name="cafe" title="Myntra Cafe website" allow="storage-access *; fullscreen *; geolocation 'none'; camera 'none'; microphone 'none'"></iframe><div id="bar"><span>Cooked fresh on our secure server</span><a id="full" href="https://myntra-cafe.myntracafe.workers.dev/menu" target="_blank" rel="noopener">Open full site</a></div><script>const origin="https://myntra-cafe.myntracafe.workers.dev";const frame=document.getElementById('cafe');const full=document.getElementById('full');const loader=document.getElementById('loader');function appPathForGithub(){let p=location.pathname;if(p.endsWith('/index.html'))p=p.slice(0,-11);if(location.hash.startsWith('#/'))return location.hash.slice(1)||'/';if(p.length>1&&p.endsWith('/'))p=p.slice(0,-1);return (p||'/')+location.search+location.hash;}function toApp(path){const t=new URL(path,origin);return t.origin===origin?t:null;}function syncChrome(appHref){try{full.href=appHref;}catch{}try{loader.style.display='none';}catch{}}function initial(){const t=toApp(appPathForGithub());const href=t?t.href:origin;frame.src=href;syncChrome(href);try{frame.contentWindow.postMessage({type:'cafe-ping'},origin);}catch{}}frame.addEventListener('load',()=>{syncChrome(frame.src||origin);try{frame.contentWindow.postMessage({type:'cafe-ping'},origin);}catch{}});window.addEventListener('message',(e)=>{if(e.origin!==origin)return;const d=e.data||{};if(d.type==='cafe-ready'){try{frame.contentWindow.postMessage({type:'cafe-go',path:appPathForGithub()},origin);}catch{}return;}if(d.type!=='cafe-navigate'||typeof d.path!=='string')return;const t=toApp(d.path);if(!t)return;const visible=t.pathname+t.search+t.hash;const current=location.pathname+location.search+location.hash;if(visible!==current)history.replaceState(null,'',visible);syncChrome(t.href);});window.addEventListener('popstate',()=>{const t=toApp(appPathForGithub());if(t)try{frame.contentWindow.postMessage({type:'cafe-go',path:t.pathname+t.search+t.hash},origin);}catch{}});window.addEventListener('hashchange',()=>{const t=toApp(appPathForGithub());if(t)try{frame.contentWindow.postMessage({type:'cafe-go',path:t.pathname+t.search+t.hash},origin);}catch{}});initial();</script></body></html>
